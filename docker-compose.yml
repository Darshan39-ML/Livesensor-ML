version: '3.8'

services:
  mongo:
    image: mongo:6.0
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      - MONGODB_URI=mongodb://mongo:27017/sensor_db
    volumes:
      - .:/app:ro
    depends_on:
      - mongo
    restart: unless-stopped

volumes:
  mongo-data:
